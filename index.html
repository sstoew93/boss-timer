<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGAMU Boss Timers</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #eee; padding: 20px; }
        h1 { text-align: center; }
        
        /* Filter styling */
        .filters { max-width: 900px; margin: 0 auto 20px auto; background: #2a2a2a; padding: 15px; border-radius: 8px; display: flex; gap: 30px; flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group h3 { margin: 0 0 10px 0; font-size: 16px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .checkbox-container { display: flex; flex-wrap: wrap; gap: 10px; max-width: 400px;}
        label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 14px; }
        
        /* Table styling */
        table { width: 100%; max-width: 900px; margin: 0 auto; border-collapse: collapse; background: #2a2a2a; }
        th, td { padding: 12px; border: 1px solid #444; text-align: left; font-size: 14px; }
        th { background: #333; }
        .countdown { font-weight: bold; color: #4ade80; }
    </style>
</head>
<body>
    <h1>🐉 MEGAMU Boss Respawn Timers</h1>
    
    <!-- Filter Areas -->
    <div class="filters">
        <div class="filter-group">
            <h3>Filter by Server</h3>
            <div class="checkbox-container" id="server-filters"></div>
        </div>
        <div class="filter-group">
            <h3>Filter by Boss</h3>
            <div class="checkbox-container" id="boss-filters"></div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>SERVER</th>
                <th>BOSS</th>
                <th>LAST KILL</th>
                <th>KILLER</th>
                <th>NEXT SPAWN</th>
                <th>REMAINING TIME</th>
            </tr>
        </thead>
        <tbody id="boss-table-body">
            <!-- Data will be loaded here -->
        </tbody>
    </table>
    <script src="script.js"></script>
</body>
</html>
