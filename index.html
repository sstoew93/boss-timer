<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGAMU Boss Timers</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #eee; padding: 20px; }
        
                <!-- NEW BANNER IMAGE SECTION -->
        <div class="banner-container">
            <!-- Just put the filename here, no https:// needed! -->
            <img src="/header.png" alt="MEGAMU Boss Timers Banner">
        </div>

        h1 { text-align: center; }
        .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 20px; }
        
        .top-bar { max-width: 1100px; margin: 0 auto 20px auto; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .search-container { flex-grow: 1; }
        .search-container input { width: 100%; padding: 10px 15px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 16px; outline: none; }
        .search-container input:focus { border-color: #4ade80; }

        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background-color: #333; color: white; padding: 10px 15px; font-size: 16px; border: 1px solid #444; border-radius: 5px; cursor: pointer; min-width: 150px; text-align: left; }
        .dropbtn:hover { background-color: #444; }
        .dropdown-content { display: none; position: absolute; background-color: #2a2a2a; min-width: 200px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5); z-index: 1; border: 1px solid #444; border-radius: 5px; max-height: 300px; overflow-y: auto; }
        .dropdown-content.show { display: block; }
        .checkbox-container { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .checkbox-container label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        
        table { width: 100%; max-width: 1100px; margin: 0 auto; border-collapse: collapse; background: #2a2a2a; }
        th, td { padding: 12px; border: 1px solid #444; text-align: left; font-size: 14px; }
        th { background: #333; }
        
        .tooltip { position: relative; display: inline-block; border-bottom: 1px dotted #888; cursor: help; }
        .tooltip .tooltiptext { visibility: hidden; width: 220px; background-color: #000; color: #fff; text-align: center; border-radius: 6px; padding: 5px; position: absolute; z-index: 1; bottom: 125%; left: 50%; margin-left: -110px; opacity: 0; transition: opacity 0.3s; font-size: 12px; border: 1px solid #555;}
        .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }

        .status-dead { color: #f87171; font-weight: bold; }
        .status-window { color: #fbbf24; font-weight: bold; }
        .status-alive { color: #4ade80; font-weight: bold; }

        /* LOGIN SCREEN STYLING */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; text-align: center; }
        #login-screen input { padding: 12px; font-size: 16px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: #fff; margin-bottom: 10px; width: 250px; text-align: center; }
        #login-screen button { padding: 12px 20px; font-size: 16px; border-radius: 5px; border: none; background: #4ade80; color: #000; font-weight: bold; cursor: pointer; }
        #login-screen button:hover { background: #22c55e; }
        #error-msg { color: #f87171; margin-top: 10px; display: none; }
        #app-content { display: none; }

        .banner-container img { 
    max-width: 100%; 
    height: auto; 
    border-radius: 8px; 
    max-height: 150px; 
    object-fit: cover;
    border: 2px solid red; /* ADD THIS LINE TEMPORARILY */
}
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <h1>🔒 Restricted Access</h1>
        <p>Please enter the password to view the boss timers.</p>
        <input type="password" id="password-input" placeholder="Enter password...">
        <button onclick="checkPassword()">Unlock</button>
        <div id="error-msg">Incorrect password. Try again.</div>
    </div>

    <!-- MAIN APP CONTENT -->
    <div id="app-content">
        
        <!-- NEW BANNER IMAGE SECTION -->
        <div class="banner-container">
            <!-- REPLACE THE SRC LINK BELOW WITH YOUR DIRECT IMAGE LINK -->
            <img src="https://i.imgur.com/YOUR_IMAGE_LINK_HERE.png" alt="MEGAMU Boss Timers Banner">
        </div>

        <!-- You can keep the subtitle or delete it -->
        <div class="subtitle">Respawn times are windows (Min - Max). Hover over times for details.</div>
        
        <div class="top-bar">
            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Search by server, boss, or killer...">
            </div>
            <div class="dropdown">
                <button class="dropbtn" onclick="toggleDropdown('server-dropdown')">Filter Servers ▼</button>
                <div id="server-dropdown" class="dropdown-content">
                    <div id="server-filters" class="checkbox-container"></div>
                </div>
            </div>
            <div class="dropdown">
                <button class="dropbtn" onclick="toggleDropdown('boss-dropdown')">Filter Bosses ▼</button>
                <div id="boss-dropdown" class="dropdown-content">
                    <div id="boss-filters" class="checkbox-container"></div>
                </div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>SERVER</th>
                    <th>BOSS</th>
                    <th>STATUS</th>
                    <th>LAST KILLER</th>
                    <th>LAST KILL (BG)</th>
                    <th>SPAWN WINDOW (BG)</th>
                    <th>TIME REMAINING</th>
                </tr>
            </thead>
            <tbody id="boss-table-body"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
