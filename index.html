<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Timer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #09090b; 
            background-image: radial-gradient(circle at 50% 0%, #1c1c22 0%, #09090b 60%);
            color: #fafafa; 
            padding: 40px 20px; 
            margin: 0;
            min-height: 100vh;
            cursor: url('images/cursor.cur'), auto; 
        }

        a, button, input, select, 
        .dropbtn, 
        .dropdown-content, 
        .checkbox-container, 
        .checkbox-container label, 
        .checkbox-container input[type="checkbox"] {
            cursor: url('images/cursor2.png'), auto;
        }

        /* --- COOL STYLIZED HEADER (DARK CHROME THEME) --- */
        .main-header { text-align: center; margin-bottom: 40px; perspective: 1000px; }
        .cool-header {
            font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900;
            margin: 0; text-transform: uppercase; letter-spacing: 6px; position: relative; display: inline-block;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 20%, #3f3f46 50%, #a1a1aa 80%, #ffffff 100%);
            background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text;
            animation: shine 5s linear infinite, float 4s ease-in-out infinite;
            text-shadow: 0px 0px 20px rgba(255, 255, 255, 0.1);
            --mouse-x: 50%; --mouse-y: 50%;
        }
        .cool-header::before {
            content: "MEGA Mu BOSS Timer"; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at var(--mouse-x) var(--mouse-y), rgba(255, 255, 255, 1) 0%, transparent 40%);
            -webkit-background-clip: text; background-clip: text; color: transparent; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 0.3s;
        }
        .cool-header:hover::before { opacity: 1; }
        .subtitle { text-align: center; color: #a1a1aa; font-size: 15px; margin-bottom: 30px; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; }

        /* --- TOP BAR (Search & Filters) --- */
        .top-bar { max-width: 1100px; margin: 0 auto 20px auto; display: flex; gap: 15px; flex-wrap: wrap; }
        .search-container { flex-grow: 1; }
        .search-container input { width: 40%; padding: 12px 20px; border-radius: 10px; border: 1px solid #27272a; background: #18181b; color: #fff; font-size: 15px; font-family: 'Inter', sans-serif; outline: none; transition: all 0.2s; }
        .search-container input:focus { border-color: #52525b; box-shadow: 0 0 0 3px rgba(255,255,255,0.05); }

        /* --- DROPDOWNS --- */
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background-color: #18181b; color: #e4e4e7; padding: 12px 20px; font-size: 14px; font-family: 'Inter', sans-serif; font-weight: 500; border: 1px solid #27272a; border-radius: 10px; cursor: pointer; min-width: 160px; text-align: left; transition: all 0.2s; }
        .dropbtn:hover { border-color: #52525b; background: #1f1f23; }
        .dropdown-content { display: none; position: absolute; background-color: #18181b; min-width: 200px; box-shadow: 0px 10px 30px rgba(0,0,0,0.8); z-index: 10; border: 1px solid #27272a; border-radius: 10px; max-height: 300px; overflow-y: auto; }
        .dropdown-content::-webkit-scrollbar { width: 8px; }
        .dropdown-content::-webkit-scrollbar-track { background: #18181b; border-radius: 8px; }
        .dropdown-content::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 8px; }
        .dropdown-content::-webkit-scrollbar-thumb:hover { background: #52525b; }
        .dropdown-content.show { display: block; }
        .checkbox-container { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .checkbox-container label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: #d4d4d8; }
        .checkbox-container input[type="checkbox"] { accent-color: #6366f1; }

        /* --- TABLE STYLED AS CARDS --- */
        .table-container { max-width: 1100px; margin: 0 auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 12px; }
        thead { display: none; } 
        tbody tr { background: #18181b; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3); border-radius: 12px; transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease; }
        tbody tr:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.6), 0 4px 6px -2px rgba(0, 0, 0, 0.4); background: #1f1f23; }
        td { padding: 20px; vertical-align: middle; border-top: 1px solid #27272a; border-bottom: 1px solid #27272a; }
        td:first-child { border-left: 1px solid #27272a; border-radius: 12px 0 0 12px; }
        td:last-child { border-right: 1px solid #27272a; border-radius: 0 12px 12px 0; text-align: right; }

        .boss-name { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .boss-subtext { font-size: 13px; color: #a1a1aa; }
        .server-badge { background: #27272a; color: #e4e4e7; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; display: inline-block; border: 1px solid #3f3f46; }
        .window-text { font-size: 13px; color: #a1a1aa; line-height: 1.6; }
        .window-text strong { color: #e4e4e7; font-weight: 500; }

        .status-pill { background: #27272a; color: #e4e4e7; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 8px; border: 1px solid #3f3f46; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; position: relative; }
        .status-pill.dead .status-dot { background: #ef4444; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); animation: pulse-red 2s infinite; }
        .status-pill.window .status-dot { background: #f59e0b; box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); animation: pulse-amber 1.5s infinite; }
        .status-pill.alive .status-dot { background: #10b981; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); animation: pulse-green 2s infinite; }

        @keyframes pulse-red { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        @keyframes pulse-amber { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); } }
        @keyframes pulse-green { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        @keyframes shine { to { background-position: 200% center; } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }

        .timer-main { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
        .timer-sub { font-size: 12px; color: #71717a; }

        /* --- LOGIN SCREEN --- */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center; }
        #login-screen h1 { font-family: 'Orbitron', sans-serif; font-size: 2rem; margin-bottom: 10px; font-weight: 900; color: #fff; letter-spacing: 2px;}
        #login-screen input { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #27272a; background: #18181b; color: #fff; margin-bottom: 15px; width: 300px; text-align: center; outline: none; transition: all 0.2s; }
        #login-screen input:focus { border-color: #52525b; box-shadow: 0 0 0 3px rgba(255,255,255,0.05); }
        #login-screen button { padding: 12px 24px; font-size: 16px; font-weight: 600; border-radius: 8px; border: none; background: #fafafa; color: #09090b; cursor: pointer; transition: background 0.2s, transform 0.1s; }
        #login-screen button:hover { background: #e4e4e7; transform: scale(1.02); }
        #error-msg { color: #ef4444; margin-top: 15px; display: none; font-size: 14px; font-weight: 500; }
        #app-content { display: none; }

        /* --- MOBILE RESPONSIVE FIX --- */
        @media (max-width: 768px) {
            table { border-spacing: 0; }
            tbody tr { display: block; margin-bottom: 24px; }
            td { display: block; text-align: left !important; border: none; border-bottom: 1px solid #27272a; padding: 16px 20px; }
            td:first-child { border-left: none; border-top: none; border-radius: 12px 12px 0 0; }
            td:last-child { border-right: none; border-bottom: none; border-radius: 0 0 12px 12px; text-align: left !important; }
            .server-badge { margin-top: 10px; margin-bottom: 10px; }
            .window-text { margin-top: 10px; }
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <h1>🔒 RESTRICTED ACCESS</h1>
        <p style="color: #a1a1aa; font-size: 15px; margin-bottom: 20px;">Please enter the password to view the boss timers.</p>
        <input type="password" id="password-input" placeholder="Enter password...">
        <button onclick="checkPassword()">Unlock</button>
        <div id="error-msg">Incorrect password. Try again.</div>
    </div>

    <!-- MAIN APP CONTENT -->
    <div id="app-content">
        
        <header class="main-header">
            <h1 class="cool-header" id="main-title">MEGA Mu BOSS Timer</h1>
        </header>
        <div class="subtitle">• Respawn times are dynamic •</div>
        
        <div class="top-bar">
            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Search by server, boss, or killer...">
            </div>
            <div class="dropdown">
                <button class="dropbtn" onclick="toggleDropdown('server-dropdown')">Filter Servers ▼</button>
                <div id="server-dropdown" class="dropdown-content">
                    <div id="server-filters" class="checkbox-container"></div>
                </div>
            </div>
            <div class="dropdown">
                <button class="dropbtn" onclick="toggleDropdown('boss-dropdown')">Filter Bosses ▼</button>
                <div id="boss-dropdown" class="dropdown-content">
                    <div id="boss-filters" class="checkbox-container"></div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>BOSS</th>
                        <th>SERVER</th>
                        <th>WINDOW</th>
                        <th>TIMER</th>
                    </tr>
                </thead>
                <tbody id="boss-table-body">
                    <!-- Data will load here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Header mouse tracking
        const title = document.getElementById('main-title');
        title.addEventListener('mousemove', (e) => {
            const rect = title.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            title.style.setProperty('--mouse-x', `${x}px`);
            title.style.setProperty('--mouse-y', `${y}px`);
        });
    </script>
</body>
</html>
