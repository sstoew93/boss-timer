<script>
    let chatSocket = null;

    document.getElementById('botForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const token = document.getElementById('token').value.trim();
        const trigger = document.getElementById('trigger').value.trim();
        const reply = document.getElementById('reply').value.trim();
        const channels = document.getElementById('channels').value.split(',').map(c => c.trim().replace('#', ''));

        if (chatSocket) {
            chatSocket.close();
        }

        chatSocket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

        chatSocket.onopen = () => {
            document.getElementById('status').textContent = 'Connecting to Twitch...';
            // Authenticate
            chatSocket.send(`PASS oauth:${token}`);
            chatSocket.send(`NICK ${username}`);
            // Join channels
            channels.forEach(channel => {
                chatSocket.send(`JOIN #${channel}`);
            });
        };

        chatSocket.onmessage = (event) => {
            const message = event.data;
            
            // Twitch requires responding to PING to keep the connection alive
            if (message.includes('PING')) {
                chatSocket.send('PONG :tmi.twitch.tv');
                return;
            }

            // Parse chat messages
            if (message.includes('PRIVMSG')) {
                // Basic parsing: ":user!user@user.tmi.twitch.tv PRIVMSG #channel :message"
                const match = message.match(/^:(.+)!.+ PRIVMSG #(\S+) :(.+)$/);
                if (match) {
                    const sender = match[1];
                    const channel = match[2];
                    const text = match[3];

                    // Ignore messages sent by the bot itself
                    if (sender.toLowerCase() === username.toLowerCase()) return;

                    // Check for trigger
                    if (text.toLowerCase().includes(trigger.toLowerCase())) {
                        // Send reply
                        chatSocket.send(`PRIVMSG #${channel} :${reply}`);
                        console.log(`Replied in #${channel} to ${sender}`);
                        document.getElementById('status').textContent = `Replied in #${channel}`;
                    }
                }
            }
        };

        chatSocket.onclose = () => {
            document.getElementById('status').textContent = 'Disconnected from Twitch.';
        };

        chatSocket.onerror = (error) => {
            console.error('WebSocket Error:', error);
            document.getElementById('status').textContent = 'Connection Error. Check console.';
        };

        document.getElementById('status').textContent = 'Bot starting...';
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
        if (chatSocket) {
            chatSocket.close();
            chatSocket = null;
            document.getElementById('status').textContent = 'Bot stopped.';
        }
    });
</script>
